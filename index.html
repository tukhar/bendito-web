<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bendito — Guided Stretching</title>
  <meta name="description" content="Guided daily stretching, posture resets, targeted pain relief and custom routines with voice coaching.">
  <meta name="theme-color" content="#f7f1e8">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bendito">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var t = JSON.parse(localStorage.getItem("bendito.v1") || "{}").settings?.themeMode;
      if (t === "DARK") document.documentElement.setAttribute("data-theme", "dark");
      if (t === "LIGHT") document.documentElement.setAttribute("data-theme", "light");
    } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app"></div>
  <noscript><div class="noscript">Bendito needs JavaScript to run.</div></noscript>
</body>
</html>
